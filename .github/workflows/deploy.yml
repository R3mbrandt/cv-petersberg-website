# Baut die Website bei jeder Änderung (auch aus dem Redaktionssystem) und
# veröffentlicht sie – täglich nachts zusätzlich, damit vergangene Termine verschwinden.
#
# Ziel 1 – OVH-Webhosting (cv-petersberg.de):
#   läuft, sobald unter Settings → Secrets and variables → Actions
#   die Variable FTP_ZIELORDNER (z. B. "cvp-neu/") und die Secrets
#   FTP_SERVER, FTP_BENUTZER, FTP_PASSWORT angelegt sind.
#   FTP_ZIELORDNER ist relativ zum Startordner des FTP-Benutzers; ist der Benutzer
#   schon auf den Ordner der Website beschränkt, "./" eintragen.
#   Übertragung ausschließlich per SFTP (verschlüsselt). Optional: Variable FTP_PORT
#   (Standard 22) und Secret FTP_HOSTKEY (Serverschlüssel im known_hosts-Format;
#   ohne ihn steht der aktuelle Schlüssel als Hinweis im Protokoll des Laufs).
#   Sicherheit: Hochgeladen wird nur in einen leeren Ordner oder einen Ordner mit der
#   Kennzeichendatei .cvp-website, nie in einen Ordner mit WordPress oder www.
# Ziel 2 – GitHub Pages (Testadresse r3mbrandt.github.io/…):
#   läuft, solange die Variable GITHUB_PAGES nicht auf "false" steht.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  ovh-ftp:
    if: vars.FTP_ZIELORDNER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Website prüfen (Links, Weiterleitungen, Kalender)
        run: npm test
      - name: Upload zu OVH per SFTP
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BENUTZER: ${{ secrets.FTP_BENUTZER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORT }}
          HOSTKEY: ${{ secrets.FTP_HOSTKEY }}
          ZIEL: ${{ vars.FTP_ZIELORDNER }}
          PORT: ${{ vars.FTP_PORT || '22' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          ZIEL="${ZIEL%/}"; ZIEL="${ZIEL:-.}"

          # Serverschlüssel: ist das Secret FTP_HOSTKEY gesetzt, wird nur dieser Server akzeptiert.
          KH="${RUNNER_TEMP:-/tmp}/cvp_known_hosts"
          if [ -n "$HOSTKEY" ]; then
            # Erlaubt: nur "ssh-ed25519 AAAA…" (Servername wird ergänzt) oder eine vollständige known_hosts-Zeile
            case "$HOSTKEY" in
              ssh-*|ecdsa-*) if [ "$PORT" = 22 ]; then N="$SERVER"; else N="[$SERVER]:$PORT"; fi
                             printf '%s %s\n' "$N" "$HOSTKEY" > "$KH" ;;
              *)             printf '%s\n' "$HOSTKEY" > "$KH" ;;
            esac
            PRUEFUNG="set sftp:auto-confirm no; set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KH';"
          else
            echo "::warning::Kein FTP_HOSTKEY hinterlegt – Serverschlüssel wird ungeprüft akzeptiert. Aktueller Schlüssel des Servers (für das Secret FTP_HOSTKEY):"
            ssh-keyscan -p "$PORT" -t ed25519 "$SERVER" 2>/dev/null | cut -d' ' -f2- | sed 's/^/    /' || true
            : > "$KH"
            PRUEFUNG="set sftp:auto-confirm yes; set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KH';"
          fi
          verbinden() {
            lftp --env-password -u "$BENUTZER" -p "$PORT" "sftp://$SERVER" -e "
              $PRUEFUNG set net:max-retries 2; set net:timeout 30;
              $1; bye"
          }

          # Sicherheitsprüfung vor dem Abgleich (der Abgleich löscht im Zielordner alles,
          # was nicht zur Website gehört): Hochgeladen wird nur in einen leeren Ordner oder
          # in einen Ordner mit der Kennzeichendatei .cvp-website – nie, wenn WordPress
          # oder ein Ordner www darin liegt.
          # Auflisten muss gelingen – sonst Abbruch (nie "leer" annehmen, nur weil die Verbindung hakt)
          verbinden "mkdir -p -f '$ZIEL'; cls -1a '$ZIEL/'" > liste.txt
          sed 's#/$##; s#.*/##' liste.txt | grep -vxE '\.{1,2}|' > inhalt.txt || true
          echo "Zielordner '$ZIEL' enthält $(wc -l < inhalt.txt) Einträge."
          if grep -qixE 'www|wp-admin|wp-content|wp-includes|wp-config\.php' inhalt.txt; then
            echo "::error::Im Zielordner '$ZIEL' liegt WordPress bzw. der Ordner www – Upload abgebrochen."; exit 1
          elif [ ! -s inhalt.txt ]; then
            echo "Zielordner ist leer – erster Upload."
          elif grep -qx '\.cvp-website' inhalt.txt; then
            echo "Kennzeichendatei gefunden – Ordner gehört zur Website."
          elif grep -qx '\.htaccess' inhalt.txt && verbinden "cat '$ZIEL/.htaccess'" | grep -q 'Apache-Konfiguration für das OVH-Webhosting'; then
            echo "Website aus früherem Upload erkannt (vor Einführung der Kennzeichendatei)."
          else
            echo "::error::Zielordner '$ZIEL' enthält fremde Dateien und keine Kennzeichendatei .cvp-website – Upload abgebrochen."; exit 1
          fi

          verbinden "mirror --reverse --delete --parallel=4 --exclude-glob .ftp-deploy-sync-state.json _site/ '$ZIEL/'"
          echo "Upload abgeschlossen: $(find _site -type f | wc -l) Dateien."

  pages-build:
    if: vars.GITHUB_PAGES != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Bei github.io-Adressen liegt die Seite im Unterordner /<repo>/;
      # mit eigener Domain ist base_path leer.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - run: npm test
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
