# Baut die Website bei jeder Änderung (auch aus dem Redaktionssystem) und
# veröffentlicht sie – täglich nachts zusätzlich, damit vergangene Termine verschwinden.
#
# Ziel 1 – OVH-Webhosting (cv-petersberg.de):
#   läuft, sobald unter Settings → Secrets and variables → Actions
#   die Variable FTP_ZIELORDNER (z. B. "cvp-neu/") und die Secrets
#   FTP_SERVER, FTP_BENUTZER, FTP_PASSWORT angelegt sind.
#   FTP_ZIELORDNER ist relativ zum Startordner des FTP-Benutzers; ist der Benutzer
#   schon auf den Ordner der Website beschränkt, "./" eintragen.
#   Variable FTP_PROTOKOLL: "sftp" (Standard, verschlüsselt, ab OVH-Tarif Pro)
#   oder "ftp" (unverschlüsselt, alle Tarife). OVH unterstützt kein FTPS.
#   Optional: Variable FTP_PORT (Standard 22 bzw. 21).
#   Sicherheit: enthält der Zielordner WordPress oder einen Ordner www, bricht der
#   Upload ab (der Abgleich löscht im Zielordner alles, was nicht zur Seite gehört).
# Ziel 2 – GitHub Pages (Testadresse r3mbrandt.github.io/…):
#   läuft, solange die Variable GITHUB_PAGES nicht auf "false" steht.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  ovh-ftp:
    if: vars.FTP_ZIELORDNER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload zu OVH (${{ vars.FTP_PROTOKOLL || 'sftp' }})
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BENUTZER: ${{ secrets.FTP_BENUTZER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORT }}
          ZIEL: ${{ vars.FTP_ZIELORDNER }}
          PROTOKOLL: ${{ vars.FTP_PROTOKOLL || 'sftp' }}
          PORT: ${{ vars.FTP_PORT }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          [ -n "$PORT" ] || { [ "$PROTOKOLL" = "ftp" ] && PORT=21 || PORT=22; }
          ZIEL="${ZIEL%/}"; ZIEL="${ZIEL:-.}"
          verbinden() {
            lftp --env-password -u "$BENUTZER" -p "$PORT" "$PROTOKOLL://$SERVER" -e "
              set sftp:auto-confirm yes; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30;
              $1; bye"
          }
          # Sicherheitsprüfung: Im Zielordner darf kein WordPress und kein www-Ordner liegen,
          # denn der Abgleich löscht dort alles, was nicht zur neuen Seite gehört.
          verbinden "mkdir -p -f '$ZIEL'; cls -1 --classify '$ZIEL/'" > inhalt.txt
          echo "Zielordner '$ZIEL' enthält $(wc -l < inhalt.txt) Einträge."
          if grep -qiE '(^|/)(www|wp-admin|wp-content|wp-includes)/?$|(^|/)wp-config\.php$' inhalt.txt; then
            echo "::error::Im Zielordner '$ZIEL' liegt WordPress bzw. der Ordner www – Upload abgebrochen."; exit 1
          fi
          verbinden "mirror --reverse --delete --parallel=4 --exclude-glob .ftp-deploy-sync-state.json _site/ '$ZIEL/'"
          echo "Upload abgeschlossen: $(find _site -type f | wc -l) Dateien."

  pages-build:
    if: vars.GITHUB_PAGES != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Bei github.io-Adressen liegt die Seite im Unterordner /<repo>/;
      # mit eigener Domain ist base_path leer.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
