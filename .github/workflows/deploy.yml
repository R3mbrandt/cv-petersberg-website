# Baut die Website bei jeder Änderung (auch aus dem Redaktionssystem) und
# veröffentlicht sie. Variante A: GitHub Pages (kostenlos). Variante B: per FTP
# auf bestehenden Webspace – dafür unten "deploy-ftp" aktivieren und die Secrets
# FTP_SERVER, FTP_USERNAME, FTP_PASSWORD im Repository hinterlegen.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # täglich neu bauen, damit vergangene Termine verschwinden
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Bei github.io-Adressen liegt die Seite im Unterordner /<repo>/;
      # mit eigener Domain (cv-petersberg.de) ist base_path leer.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

