# Vereinschronik. Jeder Absatz eine Zeile im Text (mit Leerzeile getrennt).
- jahr: "1948"
  text: "Bereits im Jahre 1948 fassten einige beherzte und humoristisch veranlagte Männer der Sängervereinigung Petersberg den Entschluss, auch am Petersberg Fastnacht zu feiern."
- jahr: "1949"
  text: "Gerd vom Rosengarten (Gerd Brilka) und Prinzessin Liesel (Liesel Schenk) waren das erste Prinzenpaar am Petersberg."
- jahr: "1950"
  text: "Da das karnevalistische Treiben am Petersberg immer mehr Anklang fand und die Sängervereinigung die dazu gehörigen Vorbereitungen nicht mehr bewältigen konnte, wurde am 11.11.1950 der Carnevalverein Petersberg gegründet.\n\nEs waren 36 Mitglieder anwesend.\n\nDer Kassenbestand betrug 30,00 DM.\n\nDer Jahresbeitrag wurde auf 2,00 DM festgelegt."
- jahr: "1951"
  text: "Das Prinzenpaar im ersten Jahr der Vereingründung war Prinz Alois der 3. vom weißen Bock (Alois Herber) und Prinzessin Hildegard (Hildegard Emmert).\n\nSitzungspräsident: Willi Schenk\n\nAdjutant: Paul Laux\n\nAm 10. Februar 1951 gab sich der Verein eine Satzung."
- jahr: "1952"
  text: "In diesem Jahr wurde der erste Vereinausflug durchgeführt. Ziel war Friesenhausen."
- jahr: "1956"
  text: "In 1956 wurde zwar Fastnacht gefeiert, es regierte aber kein Prinzenpaar. Bis jetzt konnte der Grund noch nicht festgestellt werden."
- jahr: "1959"
  text: "Generalversammlung am 18.11.1959 bei Birkenbach. Zu Punkt 2 – Kassenbericht erklärte der Kassenprüfer Fritz Spork, dass an der korrekten und sauberen Kassenführung unseres Kassierers Willi Henkel nicht das Geringste zu beanstanden sei. Spork bezeichnete den Kassenbestand als sehr gut und unser Verein könne mit Zuversicht in die Zukunft schauen. Er bat darum, keine Zahlen nennen zu brauchen, da vermieden werden solle, dass durch „Schwatzhaftigkeit“ die Öffentlichkeit erfährt, wie hoch der Kassenbestand zur Zeit ist."
- jahr: "1962"
  text: "In 1962 gab es wegen des Umbaus der Turnhalle kein Prinzenpaar am Petersberg.\n\nLaut Beschluss der Generalversammlung vom 13.01.1962 wurde der Mitgliedsbeitrag von 2,00 DM auf 3,00 DM im Jahr erhöht."
- jahr: "1963"
  text: "Ebenfalls wegen Umbau der Turnhalle gab es auch in diesem Jahr kein Prinzenpaar.\n\n1963 hatte der Verein bereits 55 Mitglieder."
- jahr: "1964"
  text: "Fastnachtsveranstaltungen erstmals im neuen Propsteihaus\n\nEinnahmen in 1964: 3.805,00 DM\n\nAusgaben in 1964: 3.410,00 DM\n\nÜberschuss 1964: 395,00 DM\n\nMitgliederzahl in 1964: 62 Mitglieder"
- jahr: "1965"
  text: "1. Maskenball am 30.01.1965 mit der Kapelle Fritz Herber.\n\nMitgliederzahl in 1965: 60 Mitglieder"
- jahr: "1966"
  text: "1. Petersberger Nacht am 12.02.1966.\n\nDie Petersberger Nacht wurde von Emil Dehler und Egon Freiwald ins Leben gerufen.\n\nIn 1966 wurde auch der 1. Rosenmontagswagen für den Romo-Zug in Fulda bei der Firma Otto Aschenbrücker gebaut.\n\nMitgliederzahl in 1966: 63 Mitglieder"
- jahr: "1967"
  text: "In 1967 wurde von Prinz Heinz-Dieter XVI. von den Höfen (Heinz-Dieter Trager) das Stimmungslied „Prost – Prost – Prösterchen hinein“ gedichtet.\n\nText und Melodie sind vorhanden.\n\nDer Jahresbeitrag betrug immer noch 3,00 DM.\n\nMitgliederzahl in 1967: 65 Mitglieder\n\nDie Prinzen bekommen in 1967 erstmals eigene Mützen."
- jahr: "1970"
  text: "Am 23.07.1970 wurde der Carnevalverein Petersberg am Amtsgericht in Fulda eingetragen.\n\nIn 1970 wurden neuer Elferatsmützen angeschafft."
- jahr: "1971"
  text: "Der Elferrat erhält neue rote Jacken."
- jahr: "1972"
  text: "Jahreshauptversammlung am 25.03.1972: bei dieser Versammlung wurde Alfred Limpert zum Ehrenpräsidenten ernannt.\n\nDer Jahresbeitrag wurde von 3,00 DM auf 6,00 DM erhöht.\n\nOtmar Bug wird bei dieser Veranstaltung auf Vorschlag von Egon Freiwald einstimmig zum Präsidenten ernannt.\n\nAm 23.09.1972 fand der erste Tiroler Abend mit Jodlerkönig Franzl Lang statt."
- jahr: "1974"
  text: "Am 06.01.1974 ist der Gründungstag der Petersberger Propsteisänger.\n\nGründer: Erich Sauer, Otmar Bug, Hermann Goldbach, Walter Stock,\n\nDieter Baun, Bernd Baun und Hans-Georg Müller\n\n1. Vorsitzender: Erich Sauer\n\n1. Kassenverwalter. Helmut Mahr.\n\nSänger: Erich Sauer, Hermann Goldbach, Gerhard Möser, Günther Möser,\n\nMichael Traut, Reinhold Wingenfeld, Hermann Wingenfeld,\n\nHelmut Mahr, Gerhard Pappert und Josef Herzig\n\nPianist: Oswald Krain\n\nTexte: Bernd und Dieter Baun\n\nDie Propsteisänger wurden in den Carnevalverein Petersberg als eigenständige Gruppe aufgenommen; bei Veranstaltungen der CVP treten sie kostenlos auf.\n\nAm 15.12.1974 findet die 1. Nikolausfeier im Casino statt. Es waren ca. 65 Kinder anwesend."
- jahr: "1975"
  text: "Jahreshauptversammlung am 08.04.1975:\n\nDer Jahresbeitrag wurde von 6,00 DM auf 12,00 DM erhöht (für Ehefrauen 6,00 DM; insgesamt 18,00 DM pro Ehepaar)."
- jahr: "1976"
  text: "Silberprinz Michael (Michael Traut) und Prinzessin Ilona (Ilona Sauerbier)\n\nBei der Petersberger Nacht am 17.01.1976 traten folgende Künstler auf: Gesangsduo Adam und Eve (Schlagerstars aus der ZDF-Hitparade), Duo Cornelli und Gesangsstar Inge Larsen.\n\nGala-Fremdensitzung mit Margit Sponheimer.\n\nEgon Freiwald wurde während des Festkommers am 15.11.1975 im Propsteihaus zum Ehrenprinz ernannt.\n\nLotti Krekel mit Liedern, die unter dem übrigen Niveau blieben.\n\nOktoberfest mit Rolf Braun aus Mainz."
- jahr: "1977"
  text: "Oktoberfest am 08.10.1977 mit Marianne und Michael.\n\nPrinz Hermann der 26. vom fliegenden Sektkorken (Hermann Henkel) mit über 100 Einmärschen.\n\nZum Ehrenpräsident wurden Willi Schenk und Paul Laux ernannt.\n\nIn 1977 wurde am Rosenmontag erstmals die Verhaftung prominenter Bürger durchgeführt.\n\nEs wurden neue weiße Elferratsjacken mit schwarzen Hemden und roter Fliege angeschafft."
- jahr: "1979"
  text: "Am 28.01.1979 wurde der Erste CVP-Frühschoppen durchgeführt."
- jahr: "1980"
  text: "Rosenmontag komplett im Schulhof\n\nFirma Müller stellt 3 bis 4 Kleinbusse für Verhaftung und Einmärsche zur Verfügung.\n\nDie von Richard Birkenbach organisierte Fahrt nach Paris war ein Erfolg."
- jahr: "1981"
  text: "In 1981 gab es mit Dirk Derfler und Simone Heinel (heute Hörl) das erste Kinderprinzenpaar.\n\nEs wurde erstmals ein Kinderelferrat mit selbstgebastelten (zu Hause bei Familie Birkenbach) Mützen gestellt."
- jahr: "1983"
  text: "18. Petersberger Nacht mit Stargast Antonia (Schwester von Roberto Blanko)\n\nNeuanmeldungen: 20"
- jahr: "1984"
  text: "Petersberger Nacht mit Stargast Bata Ilic\n\nBombendrohung: das ganze Propsteihaus wurde von Polizeibeamten umstellt, bzw. der Saal wurde von Kriminalisten durchsucht: Gott sei Dank, das Ganze war negativ!"
- jahr: "1985"
  text: "Petersberger Nacht mit Stargast Ingrid Peters\n\nDer Niesiger Mädchen-Spielmannszug wurde vom CVP eingekleidet und alle Petersberger Einmärsche wurden musikalisch begleitet (leider nur 2 Jahre!)"
- jahr: "1986"
  text: "Petersberger Nacht mit Stargast Gaby Baginsky, der Stargast musste eine ½ Stunde vor dem Auftritt wegen starker Erkältung und Halsschmerzen noch ärztlich versorgt werden."
- jahr: "1989"
  text: "1. Petersberger Vereinsfastnacht am 03. Februar 1989. Die Vereinsfastnacht wurde vom leider zu früh verstorbenen Bürgermeister Christoph Hillenbrand unter dem 1. Vorsitzenden des CVP Richard Birkenbach ins Leben gerufen.\n\nIm Dezember 1989 wurden vom 1. Vorsitzenden Richard Birkenbach erste Kontakte mit Peter Kling vom GHCC in Geisa geknüpft.\n\nMitgliederzahl 1989: 191 Mitglieder"
- jahr: "1990"
  text: "An unserem Frühschoppen am 28.01.1990 war der erste Besuch der Geisaer hier im Propsteihaus. Sie waren begeistert von der Gastfreundlichkeit und kamen mit Säcken von Brötchen und Wurst und dem damals noch bekannten guten Rhöni-Bier.\n\nIm Januar 1990 fand der 1. Staatsbesuch mit ca. 80 Aktiven vom CVP, an der Spitze Prinz Heinz der 39. (Heinz Schäfers) mit seiner Prinzessin Heike (Heike Oeste) in Geisa statt.\n\nAm Faschingssonntag nahmen wir mit großer Mannschaft am Umzug zur Rathausbestürmung in Geisa teil. Es war ein echtes Erlebnis, wir wurden unheimlich freundlich aufgenommen.\n\nIn 1990 war das schlechteste Wetter am Rosenmontag; wegen Regen und Sturmböen wurde der Zug am Busbahnhof abgebrochen."
- jahr: "1991"
  text: "40 Jahre Carnevalverein Petersberg\n\nLeider war die Kampagne 1990 durch den Golfkrieg überschattet. Es wurde überlegt ob überhaupt Veranstaltungen stattfinden sollten. Ein öffentlicher Beschluss ergab: Saalveranstaltungen können durchgeführt werden, nur draußen sollen keine Veranstaltungen durchgeführt werden. So gab es in diesem Jahr auch keinen Rosenmontagsumzug in Fulda.\n\n4 Tage Jubiläumsveranstaltungen im Waidesgrund unter anderem mit den Originalen Steigerwälder Musikanten (Winfried Stark).\n\nAm Sonntag, 01. September 1991 fand ein großer Umzug mit ca. 20 Vereinen, hier seien besonders die Geisaer mit weit über 100 Personen zu erwähnen, statt.\n\nAm Sonntag, 01. September 1991 wurde auch die Partnerschaft mit dem GHCC Geisa beschlossen und die dazugehörigen Urkunden im Festzelt unterschrieben.\n\nMitgliederzahl 1991: 205 Mitglieder"
- jahr: "1992"
  text: "Staatsbesuch in der Partnergemeinde Breitungen mit Theaterprinz Raimund der 41. (Raimund Krieger) und seiner Prinzessin Conny (Conny Emmert), dem Bürgermeister und 1. Vorsitzenden Richard Birkenbach.\n\nDie Tanzgarde Red Devils unter der Leitung von Simone Birkenbach, sowie die Mini-Tanzgarde (heutige Tanz-Teenies) unter der Leitung von Heike Oeste und Diana Faber traten in der Kampagne 1991/1992 erstmals auf.\n\nBei der Vereinsfastnacht wurde Landrat Fritz Kramer zum Petersberger getauft. Landrat Kramer gelobte: „Mein Verstand für den Landkreis, mein Herz für Petersberg“."
- jahr: "1993"
  text: "Prinz Theo Toshiba der 42. (Theo Eichinger) und Prinzessin Resi (Resi Schmitt): Prinz Theo war ein Prinz, der alles in Reimform brachte und wenn ein Gardemädchen ausfiel, sprang er ein und machte sogar Spagat.\n\nZu einer Einladung nach Breitungen sei zu berichten, dass wir mit dem Bus am Nüsterrasen im Schnee stecken geblieben sind und erst gegen 22.00 Uhr in Breitungen angekommen sind.\n\nTheo bekam dort als Geschenk einen lebendigen Hasen (vom guten Braten haben wir leider nichts abbekommen!).\n\nMitgliederzahl 1993: 212 Mitglieder"
- jahr: "1994"
  text: "Mitgliederzahl 1994: 221 Mitglieder"
- jahr: "1996"
  text: "Prinz Richard der 45. (Richard Birkenbach) und Prinzessin Sandra (Sandra Schütz). Der 1. Vorsitzenden Richard Birkenbach hat die Doppelbelastung als Prinz und 1. Vorsitzender gut überstanden.\n\nIn der Kampagne 1995/96 wurde die Nachwuchstanzgarde unter der Leitung von Anja Stumpf neu gegründet.\n\nIn 1996 wurde der Fastnachtsamstag unter der Stabsführung des CVP und dem Namen „Foaset om Sonnobat“ neu gestaltet."
- jahr: "1997"
  text: "Prinzenpaar aus den Gassenwiesen Prinz Eberhard (Eberhard Ritter) und Prinzessin Sandra (Sandra Röder)\n\nIm Jahr 1997 traten die Tanzmäuse unter der Leitung von Brigitte Laux-Stapf und Ute Hochhäuser erstmals auf.\n\nUm bei Auswärtseinmärschen nicht immer nur „in der Ecke stehen zu müssen“ wurde von einigen aktiven Frauen die „Ratsfrauen“ ins Leben gerufen.\n\nMitgliederzahl 1997: 224 Mitglieder"
- jahr: "1998"
  text: "Mitgliederzahl 1998: 230 Mitglieder"
- jahr: "1999"
  text: "Ein Feuerwehrmann als Prinz: Prinz Stephan der XLVIII. von Feuer und Flamme (Stephan Nüchter, 1. Vorsitzender der Feuerwehr) mit Ehefrau Silvia.\n\nDie Tanzgarde Tanz Teenies und die Prinzengarde Red Devils erhalten neue Kostüme."
- jahr: "2000"
  text: "Prinz der Jahrtausendwende: Jahrtausendprinz Andreas (Andreas Montag)der 49. vom Zauberwald mit Prinzessin Tanja (Tanja Ommert).\n\nMitgliederzahl 2000. 236 Mitglieder"
- jahr: "2001"
  text: "Jubelprinz Markus der 50. von Amt und Würde (Markus Meysner) und Gardeprinzessin Sonja (Sonja Hübl)\n\nAnlässlich des 50 jährigen Bestehens des Vereines fand am 12.1.01 ein Kommersabend statt, an dem 36 Vereine und über 300 Gäste teilnahmen. Im Rahmen des bunten Programms wurde die neue Standarte, die Dank Spenden der Exprinzen angeschafft werden konnte, vorstellt und eingeweiht.\n\nDes Weiteren fand anlässlich des 10 jährigen Bestehens der Red Devils am 2.2.01 ein Garderabatz statt.\n\nIm Juli 2001 besuchte der CVP aufgrund des Jubiläums die Partnergemeinde Sabinanigo in Spanien. Dort nahmen wir am Festzug im Rahmen der alljährlich stattfindenden Fiesta Santiago teil. Die Red Devils lieferten, am Fiesta de la cerrveza (Bierfest), zu Ehren der Deutschen Partnergemeinde, einen Programmpunkt des Abends.\n\nIm August 2001 war der CVP Ausrichter des Bürgerfestes in Verbindung mit dem 50 jährigen Jubiläum des Vereins. An dem durchgeführten Festzug nahmen 19 Vereine mit ca. 500 Aktiven teil.\n\nDer Verein kann in der Kampagne 2001 folgende Garden aufweisen:\n\nPrinzengarde Red Devils unter der Leitung von Sonja Hübl;\n\nGardemädchen Sonja Jahn ist von Anfang (10Jahre) dabei!\n\nJenny Mehler ist ebenfalls seit 10 Jahren in einer Garde des CVP (angefangen bei Tanz-Teenies und jetzt bei Red Devils)\n\nTanz-Teenies unter der Leitung von Heike Oeste und Kerstin Urbaschek\n\nbei dieser Garde sind Beatrix Baumert und Yvonne Klar von Anfang an dabei (auch 10 Jahre!)\n\nNachwuchstanzgarde unter der Leitung von Ute Hochhäuser und Sonja Hübl\n\nTanzmäuse unter der Leitung von Brigitte Laux-Stapf und Jutta Gaul\n\nTanzmariechen Caroline Hutschenreiter unter der Leitung von Sonja Hübl\n\nIn 2001 findet die 36. Petersberger Nacht statt\n\nIn 2001 entsteht der 35. Rosenmontagswagen\n\nIn 2001 wird der 23. CVP Frühschoppen durchgeführt"
- jahr: "2002"
  text: "Willi Herr verlies nach langjährig engagierter Arbeit den Vorstand."
- jahr: "2003"
  text: "Auf der Jahreshauptversammlung vom 25.4.2003 wurde eine Beitragserhöhung zum 1.1.2004 beschlossen.\n\nVon bisher 8,- € pro Person zzgl. 4,- € für Ehepartner und Kind bis 18 Jahren,\n\nauf 12,- € pro Person und 6,- € für Ehepartner und Kind bis 18 Jahren.\n\nErstmal wurde Busfahrkarten für die Kampagne auf der Ordensverleihung an die Aktiven verkauft\n\nDas Sommerfest und das Fußballturnier wurden erstmals auf einen Tag gelegt."
- jahr: "2004"
  text: "Erstmals fand am Fastnachtssamstag ein Kostümball statt, der sehr großen Anklang fand.\n\nEmil Dehler und Otmar Bug wurden zu Ehrenvorsitzenden ernannt. Beide haben das 65. Lebensjahr überschritten und waren mind. 5 Jahre Vereinsvorsitzende.\n\nDer 1. Kassierer Helmut Hohmann musste aus gesundheitlichen Gründen sein Amt vorzeitig abgeben.\n\nBei den Neuwahlen auf der Jahreshauptversammlung sollen erstmals zwei gleichberechtigte Stellvertreter des Vorsitzenden gewählt werden. Dies wurde zum Anlass genommen um die bestehende Vereinssatzung zu überarbeiten."
- jahr: "2005"
  text: "Die Prinzengarde Red Devils ist erstmals mit 14 Gardemädels besetzt.\n\nEbenso haben sich die Ratsfrauen auf 13 Frauen vermehrt und treten nun mit neuen Kostümen auf.\n\nEine neue Männertanzgarde die „Piccolos“ hat sich in diesem Jahr zusammengefunden."
- jahr: "2006"
  text: "Zu ihrem 15-jährigen Gardejubiläum veranstaltete die Prinzengarde Red Devils zum 2. Mal den Tanz der Teufel und verwandelte das Propsteihaus in eine Tanzhölle. Es fanden sich 20 Teufelsweiber zusammen, darunter auch 5 Ex-Red Devils, um in dieser Jubliäums-Kampagne gemeinsam zu feiern und zu tanzen. Ebenso stammt die amtierende Prinzessin Nadja auch aus ihren Reihen.\n\nGünther Preidel und Richard Birkenbach verabschieden sich nach langjähriger erfolgreicher Vorstandstätigkeit in den Vereinsruhestand. Richard Birkenbach wird zum 1. Ehren-Präsidenten des CVP ernannt.\n\nDer neue 1. Vorsitzende des CVP ist Ralf Arens, als sein Stellvertreter wird Kai Völler gewählt."
- jahr: "2008"
  text: "Der Vorstand stellt sich vor:\n\n1. Vorsitzender: Ralf Arens\n\n2. Vorsitzender: Kai Völler\n\n1. Kassiererin: Beate Weis\n\n2. Kassierer: Markus Höhl\n\n1. Schriftführer: Jennifer Mehler\n\n2. Schriftführerin: Claudia Böhm\n\nFestausschussvorsitz: Sonja Hübl\n\nFestausschuss: Enrico Eckstein, Yvonne Friedrich, Manfred Farnung, Markus Gutberlet, Sonja Jahn, Torsten Ley, Markus Polk, Uwe Quell, Frank Schwab\n\nRechtsausschuss: Otmar Bug, Manfred Käsmann, Helga Schmitt\n\nEhrenvorsitzende: Otmar Bug, Emil Dehler\n\nEhrenpräsident: Richard Birkenbach"
- jahr: "2025"
  text: "Mit einem sportlich-stimmungsvollen Abend startet der CVP in seine 75. Jubiläumskampagne. Prinz Frank der 73. von Moderation und Touchdown und Showtanz-Prinzessin Anna-Lena werden im Propsteihaus inthronisiert."
